name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  wasm:
    name: playground (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            web/wasm
      - run: cargo fmt --all --manifest-path web/wasm/Cargo.toml -- --check
      - run: >
          cargo clippy --manifest-path web/wasm/Cargo.toml
          --target wasm32-unknown-unknown --all-targets -- -D warnings
      # The playground has to be the same compiler, not a lookalike: this
      # builds both and requires them to generate identical bytes.
      - run: cargo build --release --locked
      - run: ./web/build.sh
      - run: node web/check.mjs

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Java backend's conformance test compiles and runs its generated
      # file, and generated code needs records and sealed interfaces (Java 17).
      # Pinning the JDK is what stops a runner image's default version from
      # deciding whether that test runs, or fails.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The JavaScript backend's conformance test imports and runs its
      # generated ES module. Pinning Node is what stops a runner image's
      # default version from deciding whether that test runs, or fails.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cargo test --all-features --workspace
