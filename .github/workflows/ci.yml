name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Java backend's conformance test compiles and runs its generated
      # file, and generated code needs records and sealed interfaces (Java 17).
      # Pinning the JDK is what stops a runner image's default version from
      # deciding whether that test runs, or fails.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The JavaScript backend's conformance test imports and runs its
      # generated ES module. Pinning Node is what stops a runner image's
      # default version from deciding whether that test runs, or fails.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cargo test --all-features --workspace
